<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>GameBoy Web Core</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; padding-top: 10px; margin: 0; }
        h1 { font-size: 1.2rem; margin: 5px 0; }
        canvas { background: #9bbc0f; border: 4px solid #333; display: block; margin: 0 auto 5px; width: 240px; height: 216px; image-rendering: pixelated; }
        select { padding: 5px; margin: 5px; background: #222; color: #fff; border: 1px solid #444; font-weight: bold; }
        .controls-container { display: flex; justify-content: center; gap: 15px; margin-top: 10px; align-items: center; }
        .btn-group { display: flex; flex-direction: column; gap: 5px; }
        button { padding: 8px 15px; background: #222; color: #fff; border: 1px solid #444; cursor: pointer; font-weight: bold; border-radius: 4px; }
        button:hover { background: #444; }
        .action-buttons { display: flex; gap: 10px; }
        .dpad { display: grid; grid-template-columns: 40px 40px 40px; grid-template-rows: 40px 40px 40px; justify-items: center; align-items: center; }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
        #pc-debug { background: #000; color: #0f0; padding: 4px; width: 140px; margin: 5px auto; font-family: monospace; border: 1px solid #333; font-size: 0.8rem; }
    </style>
</head>
<body>
    <h1>GameBoy Web Core</h1>
    
    <div>
        <select id="rom-select">
            <option value="/roms/tetris.gb">Tetris (Classic)</option>
            <option value="/roms/pokemon.gb">Pokemon (Test)</option>
        </select>
    </div>

    <canvas id="screen" width="160" height="144"></canvas>
    
    <div id="pc-debug">PC: 0x0000</div>

    <div>
        <button id="avvia-btn">AVVIA</button>
        <button id="pausa-btn">PAUSA</button>
    </div>

    <div class="controls-container">
        <div class="dpad">
            <button id="btn-up">⬆️</button>
            <button id="btn-left">⬅️</button>
            <button id="btn-right">➡️</button>
            <button id="btn-down">⬇️</button>
        </div>
        <div class="btn-group">
            <div class="action-buttons">
                <button id="btn-select" style="font-size: 0.7rem;">SEL</button>
                <button id="btn-start" style="font-size: 0.7rem;">STA</button>
            </div>
            <div class="action-buttons" style="margin-top: 10px;">
                <button id="btn-b" style="background: #a00;">B</button>
                <button id="btn-a" style="background: #a00;">A</button>
            </div>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
